name: Depot browser verification
on:
  push:
    branches: [feature/interactive-character-hero]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  depot-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:depot
        env:
          CI: true
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: depot-playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
